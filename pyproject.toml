[project]
name = "songguesser"
version = "0.1.0"
description = "Multiplayer song-guessing game seeded from Spotify playlists, audio served via Deezer previews."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pillow>=11.0.0",
    "rapidfuzz>=3.10.0",
    "zeroconf>=0.136.0",
    "python-multipart>=0.0.20",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
    "detect-secrets>=1.5.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "pre-commit>=4.0.0",
    "numpy>=2.4.4",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Greek letters (α, β, γ, δ, σ) and en-dashes are mathematically meaningful
# in our docstrings; suppress the ambiguous-unicode lints there.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songguesser"]
